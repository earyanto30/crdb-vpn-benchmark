---
# =============================================================================
# join-cluster.yml — Join additional nodes to an existing CockroachDB cluster
#
# Target host groups : crdb_join  (joins)  +  crdb_main (CA / cert issuer)
# Run               : ansible-playbook -i <inventory> join-cluster.yml
#                   : ansible-playbook -i <inventory> join-cluster.yml -e crdb_advertise_mode=wireguard
#
# Scenarios (switched via vars/cockroach.yml — must match create-cluster.yml):
#   1) direct    — joining nodes advertise via direct IP and join via
#                  <crdb_main ansible_host / public_ip>:26257
#   2) wireguard — joining nodes advertise via WireGuard tunnel IP and join via
#                  <crdb_main WireGuard IP>:26257  (wg0 / wireguard-go)
#                  Ensure WireGuard is up before running:
#                  playbook/setup-wireguard/join-peer.yml  or
#                  playbook/setup-wireguard-go/join-peer.yml
#
# Production-grade steps (mirrors scripts/install-cockroachdb.sh, secure mode):
#   - Auto-detects advertise IP per scenario (or uses override)
#   - Generates TLS node certs on the CA host (crdb_main) for each joining
#     node (cockroach cert create-node) and securely distributes them
#   - Installs binary, creates cockroach user, secures dirs, deploys systemd,
#     joins the existing cluster.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Play 0 — Detect advertise hosts for ALL cockroach nodes
# Hostvars set here are re-used by Play 1 (CA cert generation) and Play 2 (join)
# ─────────────────────────────────────────────────────────────────────────────
- name: Detect CockroachDB advertise addresses
  hosts: crdb_main:crdb_join
  become: true
  vars_files:
    - vars/cockroach.yml

  tasks:
    - name: Validate crdb_advertise_mode
      ansible.builtin.fail:
        msg: "crdb_advertise_mode must be 'direct' or 'wireguard' (got '{{ crdb_advertise_mode }}')"
      when: crdb_advertise_mode not in ["direct", "wireguard"]
      delegate_to: localhost
      become: false
      run_once: true

    - name: Use manual advertise host override if set
      ansible.builtin.set_fact:
        crdb_advertise_host: "{{ crdb_advertise_host_override }}"
      when: crdb_advertise_host_override is defined and crdb_advertise_host_override | length > 0

    - name: Detect WireGuard tunnel IP (wireguard mode)
      ansible.builtin.shell: |
        set -o pipefail
        if [ -n "{{ crdb_wireguard_ip_override | default('') }}" ]; then
          echo "{{ crdb_wireguard_ip_override | default('') }}"
        else
          ip -4 addr show {{ crdb_wireguard_interface | default('wg0') }} 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n1
        fi
      args:
        executable: /bin/bash
      register: _crdb_wg_ip
      changed_when: false
      failed_when: false
      when:
        - crdb_advertise_mode == "wireguard"
        - crdb_advertise_host is not defined or crdb_advertise_host | length == 0

    - name: Set advertise host from WireGuard detection
      ansible.builtin.set_fact:
        crdb_advertise_host: "{{ _crdb_wg_ip.stdout | trim }}"
      when:
        - crdb_advertise_mode == "wireguard"
        - crdb_advertise_host is not defined or crdb_advertise_host | length == 0
        - _crdb_wg_ip.stdout is defined
        - _crdb_wg_ip.stdout | trim | length > 0

    - name: Fail if WireGuard IP could not be detected
      ansible.builtin.fail:
        msg: >
          Could not detect WireGuard IP from interface '{{ crdb_wireguard_interface }}' on {{ inventory_hostname }}.
          Ensure WireGuard is running, or set crdb_wireguard_ip_override / crdb_advertise_host_override in vars/cockroach.yml.
      when:
        - crdb_advertise_mode == "wireguard"
        - crdb_advertise_host is not defined or crdb_advertise_host | length == 0

    - name: Set advertise host (direct mode — auto)
      ansible.builtin.set_fact:
        crdb_advertise_host: "{{ public_ip | default(ansible_host) if (public_ip is defined or ansible_host is defined and ansible_host is match('^\\d+\\.\\d+\\.\\d+\\.\\d+$')) else ansible_default_ipv4.address | default(ansible_host) }}"
      when:
        - crdb_advertise_mode == "direct"
        - crdb_advertise_host is not defined or crdb_advertise_host | length == 0

    - name: Set hostname fact for cert SANs
      ansible.builtin.set_fact:
        crdb_hostname: "{{ ansible_hostname | default(inventory_hostname) }}"

    - name: Show resolved advertise address
      ansible.builtin.debug:
        msg: "   {{ inventory_hostname }} → {{ crdb_advertise_host }}:{{ crdb_sql_port }} (mode={{ crdb_advertise_mode }}, hostname={{ crdb_hostname }})"

# ─────────────────────────────────────────────────────────────────────────────
# Play 1 — Generate and stage TLS certificates for each joining node on the CA
# ─────────────────────────────────────────────────────────────────────────────
- name: Generate TLS certificates for joining nodes (on CA host)
  hosts: crdb_main
  become: true
  vars_files:
    - vars/cockroach.yml

  tasks:
    - name: Check CA key exists (must have run create-cluster.yml first)
      ansible.builtin.stat:
        path: "{{ crdb_ca_dir }}/ca.key"
      register: _crdb_ca_key

    - name: Fail if CA key is missing
      ansible.builtin.fail:
        msg: >
          CA private key not found at {{ crdb_ca_dir }}/ca.key on {{ inventory_hostname }}.
          Run create-cluster.yml first to bootstrap the cluster and generate the CA.
      when: not _crdb_ca_key.stat.exists

    - name: Check CA certificate
      ansible.builtin.stat:
        path: "{{ crdb_certs_dir }}/ca.crt"
      register: _crdb_ca_crt

    - name: Fail if CA certificate is missing
      ansible.builtin.fail:
        msg: "CA certificate not found at {{ crdb_certs_dir }}/ca.crt"
      when: not _crdb_ca_crt.stat.exists

    - name: Ensure tmp bundle base directory on CA host
      ansible.builtin.file:
        path: "{{ crdb_tmp_bundle_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Ensure controller tmp directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/tmp/crdb-certs"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create bundle directory for each joining node
      ansible.builtin.file:
        path: "{{ crdb_tmp_bundle_dir }}/{{ item }}"
        state: directory
        mode: "0700"
        owner: root
        group: root
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Copy CA certificate into each bundle
      ansible.builtin.copy:
        src: "{{ crdb_certs_dir }}/ca.crt"
        dest: "{{ crdb_tmp_bundle_dir }}/{{ item }}/ca.crt"
        mode: "0644"
        owner: root
        group: root
        remote_src: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Check client.root certificate exists on CA (for passwordless admin)
      ansible.builtin.stat:
        path: "{{ crdb_certs_dir }}/client.root.crt"
      register: _crdb_client_root_crt

    - name: Check client.root key exists on CA
      ansible.builtin.stat:
        path: "{{ crdb_certs_dir }}/client.root.key"
      register: _crdb_client_root_key

    - name: Copy client.root certificate into each bundle (if present)
      ansible.builtin.copy:
        src: "{{ crdb_certs_dir }}/client.root.crt"
        dest: "{{ crdb_tmp_bundle_dir }}/{{ item }}/client.root.crt"
        mode: "0644"
        owner: root
        group: root
        remote_src: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"
      when: _crdb_client_root_crt.stat.exists

    - name: Copy client.root key into each bundle (if present)
      ansible.builtin.copy:
        src: "{{ crdb_certs_dir }}/client.root.key"
        dest: "{{ crdb_tmp_bundle_dir }}/{{ item }}/client.root.key"
        mode: "0600"
        owner: root
        group: root
        remote_src: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"
      when: _crdb_client_root_key.stat.exists

    - name: Generate node certificate for each joining peer (include FQDN)
      ansible.builtin.shell: |
        {{ crdb_bin_path }} cert create-node \
          {{ hostvars[item].crdb_advertise_host }} \
          {{ hostvars[item].crdb_hostname }} \
          {{ item }} \
          {{ hostvars[item].fqdn | default('') }} \
          {{ hostvars[item].ansible_fqdn | default('') }} \
          {{ hostvars[item].public_ip | default('') }} \
          {{ hostvars[item].ansible_host | default('') }} \
          localhost 127.0.0.1 \
          {{ (crdb_extra_sans | default([])) | join(' ') }} \
          --certs-dir={{ crdb_tmp_bundle_dir }}/{{ item }} \
          --ca-key={{ crdb_ca_dir }}/ca.key \
          --overwrite
      args:
        executable: /bin/bash
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }} -> {{ hostvars[item].crdb_advertise_host }}"
      changed_when: true

    - name: Secure bundle permissions
      ansible.builtin.shell: |
        chmod 0644 {{ crdb_tmp_bundle_dir }}/{{ item }}/*.crt 2>/dev/null || true
        chmod 0600 {{ crdb_tmp_bundle_dir }}/{{ item }}/*.key 2>/dev/null || true
        chmod 0700 {{ crdb_tmp_bundle_dir }}/{{ item }}
      args:
        executable: /bin/bash
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"
      changed_when: true

    - name: Fetch CA certificate to controller for each peer
      ansible.builtin.fetch:
        src: "{{ crdb_tmp_bundle_dir }}/{{ item }}/ca.crt"
        dest: "{{ playbook_dir }}/tmp/crdb-certs/{{ item }}/ca.crt"
        flat: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Fetch node certificate to controller for each peer
      ansible.builtin.fetch:
        src: "{{ crdb_tmp_bundle_dir }}/{{ item }}/node.crt"
        dest: "{{ playbook_dir }}/tmp/crdb-certs/{{ item }}/node.crt"
        flat: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Fetch node key to controller for each peer
      ansible.builtin.fetch:
        src: "{{ crdb_tmp_bundle_dir }}/{{ item }}/node.key"
        dest: "{{ playbook_dir }}/tmp/crdb-certs/{{ item }}/node.key"
        flat: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Fetch client.root certificate to controller for each peer (if present)
      ansible.builtin.fetch:
        src: "{{ crdb_tmp_bundle_dir }}/{{ item }}/client.root.crt"
        dest: "{{ playbook_dir }}/tmp/crdb-certs/{{ item }}/client.root.crt"
        flat: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"
      when: _crdb_client_root_crt.stat.exists

    - name: Fetch client.root key to controller for each peer (if present)
      ansible.builtin.fetch:
        src: "{{ crdb_tmp_bundle_dir }}/{{ item }}/client.root.key"
        dest: "{{ playbook_dir }}/tmp/crdb-certs/{{ item }}/client.root.key"
        flat: true
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"
      when: _crdb_client_root_key.stat.exists

    - name: Print generated bundle info
      ansible.builtin.debug:
        msg:
          - "   Generated cert bundle for {{ item }}"
          - "   SANs: {{ hostvars[item].crdb_advertise_host }}, {{ hostvars[item].crdb_hostname }}, {{ item }}, localhost, 127.0.0.1{{ ', ' + (crdb_extra_sans | join(', ')) if crdb_extra_sans | length > 0 else '' }}"
          - "   Bundle: {{ crdb_tmp_bundle_dir }}/{{ item }}/ + {{ playbook_dir }}/tmp/crdb-certs/{{ item }}/"
      loop: "{{ groups['crdb_join'] }}"
      loop_control:
        label: "{{ item }}"

# ─────────────────────────────────────────────────────────────────────────────
# Play 2 — Install and join each peer to the existing cluster
# ─────────────────────────────────────────────────────────────────────────────
- name: Join CockroachDB nodes to existing cluster
  hosts: crdb_join
  become: true
  vars_files:
    - vars/cockroach.yml

  tasks:
    - name: Resolve join address (auto if empty)
      ansible.builtin.set_fact:
        _crdb_bootstrap_host: "{{ hostvars[groups['crdb_main'][0]].crdb_advertise_host }}"
      when: crdb_join_addr is not defined or crdb_join_addr | length == 0

    - name: Build CockroachDB address facts for joining node
      ansible.builtin.set_fact:
        crdb_advertise_addr: "{{ crdb_advertise_host }}:{{ crdb_sql_port }}"
        crdb_http_addr: "{{ crdb_http_bind }}:{{ crdb_http_port }}"
        crdb_join_target: "{{ crdb_join_addr if crdb_join_addr is defined and crdb_join_addr | length > 0 else _crdb_bootstrap_host + ':' + crdb_sql_port | string }}"

    - name: Show join configuration
      ansible.builtin.debug:
        msg:
          - "   Node           : {{ inventory_hostname }} ({{ crdb_advertise_host }})"
          - "   Advertise addr : {{ crdb_advertise_addr }}"
          - "   Join target    : {{ crdb_join_target }} (mode={{ crdb_advertise_mode }})"

    - name: Create CockroachDB system group
      ansible.builtin.group:
        name: "{{ crdb_group }}"
        system: true
        state: present

    - name: Create CockroachDB system user
      ansible.builtin.user:
        name: "{{ crdb_user }}"
        group: "{{ crdb_group }}"
        home: "{{ crdb_store_dir | dirname }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false
        comment: "CockroachDB Service Account"

    - name: Ensure data store directory
      ansible.builtin.file:
        path: "{{ crdb_store_dir }}"
        state: directory
        owner: "{{ crdb_user }}"
        group: "{{ crdb_group }}"
        mode: "0750"

    - name: Ensure certs directory
      ansible.builtin.file:
        path: "{{ crdb_certs_dir }}"
        state: directory
        owner: "{{ crdb_user }}"
        group: "{{ crdb_group }}"
        mode: "0700"

    - name: Check existing CockroachDB binary
      ansible.builtin.stat:
        path: "{{ crdb_bin_path }}"
      register: _crdb_bin_stat

    - name: Create temporary download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: cockroach-install
      register: _crdb_tmpdir
      when: not _crdb_bin_stat.stat.exists or (crdb_force_reinstall | default(false) | bool)

    - name: Download CockroachDB archive
      ansible.builtin.get_url:
        url: "{{ crdb_download_url }}"
        dest: "{{ _crdb_tmpdir.path }}/cockroach.tgz"
        mode: "0644"
        force: true
      when: not _crdb_bin_stat.stat.exists or (crdb_force_reinstall | default(false) | bool)

    - name: Extract archive
      ansible.builtin.unarchive:
        src: "{{ _crdb_tmpdir.path }}/cockroach.tgz"
        dest: "{{ _crdb_tmpdir.path }}"
        remote_src: true
      when: not _crdb_bin_stat.stat.exists or (crdb_force_reinstall | default(false) | bool)

    - name: Find extracted cockroach binary
      ansible.builtin.shell: |
        set -o pipefail
        find {{ _crdb_tmpdir.path }} -type f -name "cockroach" | head -n1
      args:
        executable: /bin/bash
      register: _crdb_extracted_bin
      changed_when: false
      when: not _crdb_bin_stat.stat.exists or (crdb_force_reinstall | default(false) | bool)

    - name: Install cockroach binary
      ansible.builtin.copy:
        src: "{{ _crdb_extracted_bin.stdout | trim }}"
        dest: "{{ crdb_bin_path }}"
        mode: "0755"
        owner: root
        group: root
        remote_src: true
      when: not _crdb_bin_stat.stat.exists or (crdb_force_reinstall | default(false) | bool)

    - name: Find extracted lib directory (GEOS)
      ansible.builtin.shell: |
        find {{ _crdb_tmpdir.path }} -type d -name "lib" 2>/dev/null | head -n1
      args:
        executable: /bin/bash
      register: _crdb_lib_dir
      changed_when: false
      failed_when: false
      when: not _crdb_bin_stat.stat.exists or (crdb_force_reinstall | default(false) | bool)

    - name: Install GEOS shared libraries
      ansible.builtin.shell: |
        mkdir -p /usr/local/lib/cockroach
        cp -r {{ _crdb_lib_dir.stdout | trim }}/* /usr/local/lib/cockroach/ 2>/dev/null || true
        ldconfig 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false
      when:
        - _crdb_lib_dir.stdout is defined
        - _crdb_lib_dir.stdout | trim | length > 0

    - name: Remove temporary download directory
      ansible.builtin.file:
        path: "{{ _crdb_tmpdir.path }}"
        state: absent
      when: _crdb_tmpdir.path is defined

    - name: Copy CA certificate from controller
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tmp/crdb-certs/{{ inventory_hostname }}/ca.crt"
        dest: "{{ crdb_certs_dir }}/ca.crt"
        mode: "0644"
        owner: "{{ crdb_user }}"
        group: "{{ crdb_group }}"

    - name: Copy node certificate from controller
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tmp/crdb-certs/{{ inventory_hostname }}/node.crt"
        dest: "{{ crdb_certs_dir }}/node.crt"
        mode: "0644"
        owner: "{{ crdb_user }}"
        group: "{{ crdb_group }}"

    - name: Copy node key from controller
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tmp/crdb-certs/{{ inventory_hostname }}/node.key"
        dest: "{{ crdb_certs_dir }}/node.key"
        mode: "0600"
        owner: "{{ crdb_user }}"
        group: "{{ crdb_group }}"

    - name: Copy client.root certificate from controller (if present — enables passwordless root)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tmp/crdb-certs/{{ inventory_hostname }}/client.root.crt"
        dest: "{{ crdb_certs_dir }}/client.root.crt"
        mode: "0644"
        owner: "{{ crdb_user }}"
        group: "{{ crdb_group }}"
      failed_when: false

    - name: Copy client.root key from controller (if present)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tmp/crdb-certs/{{ inventory_hostname }}/client.root.key"
        dest: "{{ crdb_certs_dir }}/client.root.key"
        mode: "0600"
        owner: "{{ crdb_user }}"
        group: "{{ crdb_group }}"
      failed_when: false

    - name: Verify required certificates are present
      ansible.builtin.stat:
        path: "{{ crdb_certs_dir }}/{{ item }}"
      loop:
        - ca.crt
        - node.crt
        - node.key
      register: _crdb_cert_check

    - name: Fail if any certificate is missing
      ansible.builtin.fail:
        msg: "Missing TLS file {{ item.item }} at {{ item.stat.path }} — cert generation may have failed."
      loop: "{{ _crdb_cert_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Secure certs directory permissions
      ansible.builtin.shell: |
        chown -R {{ crdb_user }}:{{ crdb_group }} {{ crdb_certs_dir }}
        chmod 0700 {{ crdb_certs_dir }}
        chmod 0644 {{ crdb_certs_dir }}/ca.crt {{ crdb_certs_dir }}/node.crt 2>/dev/null || true
        chmod 0644 {{ crdb_certs_dir }}/client.root.crt 2>/dev/null || true
        chmod 0600 {{ crdb_certs_dir }}/node.key 2>/dev/null || true
        chmod 0600 {{ crdb_certs_dir }}/client.root.key 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true

    - name: Deploy CockroachDB systemd unit (join mode)
      ansible.builtin.template:
        src: templates/cockroachdb.service.j2
        dest: "/etc/systemd/system/{{ crdb_service_name }}.service"
        mode: "0644"
        owner: root
        group: root
      notify: Reload systemd

    - name: Flush handlers (reload systemd before start)
      ansible.builtin.meta: flush_handlers

    - name: Enable and restart CockroachDB service
      ansible.builtin.systemd:
        name: "{{ crdb_service_name }}"
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Wait for CockroachDB SQL port to be open
      ansible.builtin.wait_for:
        host: "{{ crdb_advertise_host }}"
        port: "{{ crdb_sql_port }}"
        delay: 3
        timeout: 60

    - name: Verify node joined (node status via bootstrap)
      ansible.builtin.shell: |
        timeout 15 {{ crdb_bin_path }} node status --certs-dir={{ crdb_certs_dir }} --host={{ crdb_join_target }} 2>&1 || \
        timeout 15 {{ crdb_bin_path }} node status --certs-dir={{ crdb_certs_dir }} --host={{ crdb_advertise_host }} 2>&1 || \
        COCKROACH_PASSWORD='{{ crdb_db_admin_password }}' timeout 15 {{ crdb_bin_path }} sql --certs-dir={{ crdb_certs_dir }} --host={{ crdb_join_target }} --user={{ crdb_db_admin_user }} --execute="SELECT count(*) FROM crdb_internal.gossip_nodes;" 2>&1 || \
        COCKROACH_PASSWORD='{{ crdb_db_admin_password }}' timeout 15 {{ crdb_bin_path }} sql --certs-dir={{ crdb_certs_dir }} --host={{ crdb_advertise_host }} --user={{ crdb_db_admin_user }} --execute="SELECT count(*) FROM crdb_internal.gossip_nodes;" 2>&1
      register: _crdb_join_status
      until: _crdb_join_status.rc == 0 and ((_crdb_join_status.stdout is search(crdb_advertise_host)) or (_crdb_join_status.stdout is search(inventory_hostname)) or (_crdb_join_status.stdout is search('count')) or (_crdb_join_status.stdout is search('true')))
      retries: 15
      delay: 4
      changed_when: false
      failed_when: false
      no_log: false

    - name: Show join status
      ansible.builtin.debug:
        msg:
          - "   Node {{ inventory_hostname }} joined cluster via {{ crdb_join_target }}"
          - "   rc={{ _crdb_join_status.rc }} attempts={{ _crdb_join_status.attempts | default(1) }}"
          - "{{ _crdb_join_status.stdout_lines | default([]) }}"
          - "{{ _crdb_join_status.stderr_lines | default([]) }}"

    - name: Fail if node did not appear in cluster after retries
      ansible.builtin.fail:
        msg: |
          Node {{ inventory_hostname }} ({{ crdb_advertise_host }}) did not appear in `node status` after {{ _crdb_join_status.attempts | default(15) }} attempts.
          Last rc={{ _crdb_join_status.rc }}
          stdout: {{ _crdb_join_status.stdout | default('') }}
          stderr: {{ _crdb_join_status.stderr | default('') }}
          Hint: `cockroach node status` now requires a client cert (client.root.crt/key) or password.
          This playbook now distributes client.root from the CA and falls back to
          `COCKROACH_PASSWORD='{{ crdb_db_admin_password }}' {{ crdb_bin_path }} sql --certs-dir={{ crdb_certs_dir }} --host={{ crdb_join_target }} --user={{ crdb_db_admin_user }}`.
          Check `journalctl -u {{ crdb_service_name }}` and `ls -l {{ crdb_certs_dir }}/` on both nodes.
      when: not (_crdb_join_status.rc == 0 and ((_crdb_join_status.stdout is search(crdb_advertise_host)) or (_crdb_join_status.stdout is search(inventory_hostname)) or (_crdb_join_status.stdout is search('count')) or (_crdb_join_status.stdout is search('true'))))

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
