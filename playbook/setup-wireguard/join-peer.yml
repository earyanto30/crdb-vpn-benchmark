---
# Configure WireGuard peers and reconcile full mesh (kernel module)

- name: Configure WireGuard peer and register it on the server
  hosts: wireguard_peers
  become: true
  vars_files:
    - vars/wireguard.yml

  tasks:
    - name: Check server public key exists (run server.yml first)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/tmp/server_public.key"
      register: _server_pubkey_stat
      delegate_to: localhost
      become: false

    - name: Fail if server public key is missing
      ansible.builtin.fail:
        msg: >
          tmp/server_public.key not found.
          Run server.yml first to generate and fetch the server public key.
      when: not _server_pubkey_stat.stat.exists

    - name: Read server public key from controller
      ansible.builtin.set_fact:
        wg_server_public_key: "{{ lookup('file', playbook_dir + '/tmp/server_public.key') | trim }}"

    - name: Resolve WireGuard server public IP
      ansible.builtin.set_fact:
        wg_server_public_ip: "{{ hostvars[groups['wireguard_server'][0]]['ansible_host'] }}"

    - name: Auto-assign peer tunnel IP from inventory index
      ansible.builtin.set_fact:
        wg_peer_wg_ip: "{{ wg_server_wg_ip | regex_replace('\\d+$', '') }}{{ groups['wireguard_peers'].index(inventory_hostname) + 2 }}"
      when: wg_peer_wg_ip_auto | default(false) | bool

    - name: Install WireGuard and required packages
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
          - iptables
        state: present
        update_cache: true

    - name: Ensure WireGuard configuration directory exists
      ansible.builtin.file:
        path: "{{ wg_config_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Generate WireGuard peer private key
      ansible.builtin.shell:
        cmd: wg genkey | tee {{ wg_config_dir }}/peer_private.key | wg pubkey > {{ wg_config_dir }}/peer_public.key
        creates: "{{ wg_config_dir }}/peer_private.key"

    - name: Set strict permissions on peer private key
      ansible.builtin.file:
        path: "{{ wg_config_dir }}/peer_private.key"
        mode: "0600"
        owner: root
        group: root

    - name: Set read permissions on peer public key
      ansible.builtin.file:
        path: "{{ wg_config_dir }}/peer_public.key"
        mode: "0644"
        owner: root
        group: root

    - name: Read peer private key
      ansible.builtin.slurp:
        src: "{{ wg_config_dir }}/peer_private.key"
      register: _peer_private_key_b64

    - name: Read peer public key
      ansible.builtin.slurp:
        src: "{{ wg_config_dir }}/peer_public.key"
      register: _peer_public_key_b64

    - name: Set peer key facts
      ansible.builtin.set_fact:
        wg_peer_private_key: "{{ _peer_private_key_b64.content | b64decode | trim }}"
        wg_peer_public_key:  "{{ _peer_public_key_b64.content  | b64decode | trim }}"

    - name: Deploy WireGuard peer config (bootstrap hub-spoke, overwritten by mesh reconciliation)
      ansible.builtin.template:
        src: templates/peer_wg0.conf.j2
        dest: "{{ wg_config_dir }}/wg0.conf"
        mode: "0600"
        owner: root
        group: root
      notify: Restart peer WireGuard

    - name: Enable and start WireGuard on peer
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Ensure tmp directory exists on controller
      ansible.builtin.file:
        path: "{{ playbook_dir }}/tmp"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Fetch peer public key to controller
      ansible.builtin.fetch:
        src: "{{ wg_config_dir }}/peer_public.key"
        dest: "{{ playbook_dir }}/tmp/{{ inventory_hostname }}_public.key"
        flat: true

  handlers:
    - name: Restart peer WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted

# =============================================================================
# Play 2 — Register the peers on the WireGuard server (hub compat, live update)
#           This is superseded by the full-mesh reconciliation in Play 3 but
#           kept so a partially-failed mesh run still leaves hub connectivity.
# =============================================================================
- name: Register peers on WireGuard server (legacy hub step)
  hosts: wireguard_server
  become: true
  vars_files:
    - vars/wireguard.yml

  tasks:
    - name: Clear previous peer registration list (idempotency)
      ansible.builtin.set_fact:
        wg_peer_registrations: []

    - name: Build peer registration list
      ansible.builtin.set_fact:
        wg_peer_registrations: "{{ wg_peer_registrations + [{ 'name': item, 'public_key': lookup('file', playbook_dir + '/tmp/' + item + '_public.key') | trim, 'wg_ip': ((wg_server_wg_ip | regex_replace('\\d+$', '')) ~ (groups['wireguard_peers'].index(item) + 2)) if (wg_peer_wg_ip_auto | default(false) | bool) else wg_peer_wg_ip }] }}"
      loop: "{{ groups['wireguard_peers'] }}"

    - name: Add peer to running WireGuard instance
      ansible.builtin.command:
        cmd: >
          wg set {{ wg_interface }}
          peer {{ item.public_key }}
          allowed-ips {{ item.wg_ip }}/32
          persistent-keepalive {{ wg_keepalive }}
      loop: "{{ wg_peer_registrations }}"
      changed_when: true
      loop_control:
        label: "{{ item.name }}"

    - name: Check if peer is already in wg0.conf
      ansible.builtin.command:
        cmd: grep -qF "{{ item.public_key }}" {{ wg_config_dir }}/wg0.conf
      loop: "{{ wg_peer_registrations }}"
      register: _peer_exists
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.name }}"

    - name: Append peer block to server wg0.conf
      ansible.builtin.blockinfile:
        path: "{{ wg_config_dir }}/wg0.conf"
        marker: "# {mark} PEER {{ item.name }}"
        block: |
          [Peer]
          # {{ item.name }}
          PublicKey           = {{ item.public_key }}
          AllowedIPs          = {{ item.wg_ip }}/32
          PersistentKeepalive = {{ wg_keepalive }}
      loop: "{{ wg_peer_registrations }}"
      loop_control:
        label: "{{ item.name }}"
        extended: true
      when: _peer_exists.results[ansible_loop.index0].rc != 0

# Play 3: Reconcile full-mesh WireGuard config on all nodes
- name: Reconcile full-mesh WireGuard config on all nodes
  hosts: wireguard_server:wireguard_peers
  become: true
  vars_files:
    - vars/wireguard.yml

  tasks:
    - name: Auto-assign mesh IP for this host (peers only; server keeps .1)
      ansible.builtin.set_fact:
        wg_mesh_ip: "{{ wg_server_wg_ip if inventory_hostname in groups['wireguard_server'] else ((wg_server_wg_ip | regex_replace('\\d+$', '')) ~ (groups['wireguard_peers'].index(inventory_hostname) + 2) if (wg_peer_wg_ip_auto | default(false) | bool) else wg_peer_wg_ip) }}"

    - name: Read server private key (server hosts)
      ansible.builtin.slurp:
        src: "{{ wg_config_dir }}/server_private.key"
      register: _mesh_private_key_b64_server
      when: inventory_hostname in groups['wireguard_server']
      failed_when: false

    - name: Read peer private key (peer hosts)
      ansible.builtin.slurp:
        src: "{{ wg_config_dir }}/peer_private.key"
      register: _mesh_private_key_b64_peer
      when: inventory_hostname in groups['wireguard_peers']
      failed_when: false

    - name: Set mesh private key fact
      ansible.builtin.set_fact:
        wg_private_key: >-
          {{
            (_mesh_private_key_b64_server.content | b64decode | trim) if inventory_hostname in groups['wireguard_server'] and _mesh_private_key_b64_server.content is defined
            else (_mesh_private_key_b64_peer.content | b64decode | trim) if inventory_hostname in groups['wireguard_peers'] and _mesh_private_key_b64_peer.content is defined
            else ''
          }}

    - name: Fail if private key could not be read
      ansible.builtin.fail:
        msg: "WireGuard private key not found at {{ wg_config_dir }}/*_private.key on {{ inventory_hostname }}"
      when: wg_private_key == ''

    - name: Clear previous mesh_peers fact (idempotency)
      ansible.builtin.set_fact:
        mesh_peers: []

    - name: Build full mesh peer list
      ansible.builtin.set_fact:
        mesh_peers: "{{ mesh_peers + [{'name': item, 'public_key': (lookup('file', playbook_dir + '/tmp/server_public.key') | trim) if item in groups['wireguard_server'] else (lookup('file', playbook_dir + '/tmp/' + item + '_public.key') | trim), 'wg_ip': (wg_server_wg_ip if item in groups['wireguard_server'] else ((wg_server_wg_ip | regex_replace('\\d+$', '')) ~ (groups['wireguard_peers'].index(item) + 2) if (wg_peer_wg_ip_auto | default(false) | bool) else wg_peer_wg_ip)), 'endpoint': hostvars[item]['ansible_host']}] }}"
      loop: "{{ groups['wireguard_server'] + groups['wireguard_peers'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Deploy full-mesh WireGuard config
      ansible.builtin.template:
        src: templates/mesh_wg0.conf.j2
        dest: "{{ wg_config_dir }}/wg0.conf"
        mode: "0600"
        owner: root
        group: root
      notify: Restart mesh WireGuard

    - name: Enable and start WireGuard (mesh)
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart mesh WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted
