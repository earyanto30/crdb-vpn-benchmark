---
# Load TPC-C fixtures, run benchmark, and clean up data from workload driver

- name: Run TPC-C benchmark (cockroach workload, TLS)
  hosts: workload_driver
  become: true
  vars_files:
    - vars/driver.yml

  pre_tasks:
    - name: Resolve target host
      ansible.builtin.set_fact:
        driver_resolved_target: >-
          {{ driver_target_host if driver_target_host is defined and driver_target_host | length > 0
             else hostvars[groups['crdb_main'][0]]['ansible_host'] | default(hostvars[groups['crdb_main'][0]]['public_ip']) }}
      when: driver_target_host is not defined or driver_target_host | length == 0

    - name: Set target fact when override provided
      ansible.builtin.set_fact:
        driver_resolved_target: "{{ driver_target_host }}"
      when: driver_target_host is defined and driver_target_host | length > 0

  tasks:
    - name: Ensure results directory exists
      ansible.builtin.file:
        path: "{{ driver_results_dir }}"
        state: directory
        owner: "{{ ansible_user | default('evan') }}"
        group: "{{ ansible_user | default('evan') }}"
        mode: "0755"

    - name: Check cockroach binary
      ansible.builtin.stat:
        path: "{{ driver_bin_path }}"
      register: _bench_bin

    - name: Fail if binary missing (run setup.yml first)
      ansible.builtin.fail:
        msg: "{{ driver_bin_path }} missing — run setup.yml first."
      when: not _bench_bin.stat.exists

    - name: Wait for SQL port
      ansible.builtin.wait_for:
        host: "{{ driver_resolved_target }}"
        port: "{{ driver_sql_port }}"
        timeout: 60

    - name: Tune cluster for fast ingest (bulk I/O) before load
      ansible.builtin.shell: |
        COCKROACH_PASSWORD='{{ driver_db_password }}' {{ driver_bin_path }} sql \
          --certs-dir={{ driver_certs_dir }} --host={{ driver_resolved_target }}:{{ driver_sql_port }} --user={{ driver_db_user }} \
          --execute="SET CLUSTER SETTING bulkio.backup.proxy_file_writes.enabled = off; SET CLUSTER SETTING kv.bulk_io_write.max_rate = '2GiB'; SET CLUSTER SETTING kv.bulk_io_write.concurrent_addsstable_requests = 64;" 2>&1 | tail -n 5
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Load TPCC fixtures (warehouses={{ driver_tpcc_warehouses }})
      ansible.builtin.shell: |
        set -o pipefail
        _workers_arg=""; if [ "{{ driver_tpcc_workers | default(0) }}" != "0" ]; then _workers_arg="--workers={{ driver_tpcc_workers }}"; fi
        _max_rate_arg=""; if [ "{{ driver_tpcc_max_rate | default(0) }}" != "0" ]; then _max_rate_arg="--max-rate={{ driver_tpcc_max_rate }}"; fi
        COCKROACH_PASSWORD='{{ driver_db_password }}' {{ driver_bin_path }} workload init tpcc \
          --drop \
          --data-loader {{ driver_tpcc_data_loader | default('INSERT') }} \
          --warehouses={{ driver_tpcc_warehouses }} \
          --init-conns={{ driver_tpcc_init_conns | default(64) }} \
          $_workers_arg $_max_rate_arg {{ driver_tpcc_extra_args }} \
          "postgres://{{ driver_db_user }}:{{ driver_db_password }}@{{ driver_resolved_target }}:{{ driver_sql_port }}/tpcc?sslmode=require&sslrootcert={{ driver_certs_dir }}/ca.crt" 2>&1 | tee {{ driver_results_dir }}/tpcc-load.log
      args:
        executable: /bin/bash
      register: _tpcc_load
      changed_when: "'init completed' in _tpcc_load.stdout or 'Load finished' in _tpcc_load.stdout or _tpcc_load.rc == 0"
      failed_when: false

    - name: Set short GC TTL
      ansible.builtin.shell: |
        COCKROACH_PASSWORD='{{ driver_db_password }}' timeout 30 {{ driver_bin_path }} sql \
          --certs-dir={{ driver_certs_dir }} \
          --host={{ driver_resolved_target }}:{{ driver_sql_port }} \
          --user={{ driver_db_user }} \
          --execute="ALTER DATABASE tpcc CONFIGURE ZONE USING gc.ttlseconds = 600;"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Restore cluster bulk settings after load
      ansible.builtin.shell: |
        COCKROACH_PASSWORD='{{ driver_db_password }}' {{ driver_bin_path }} sql \
          --certs-dir={{ driver_certs_dir }} --host={{ driver_resolved_target }}:{{ driver_sql_port }} --user={{ driver_db_user }} \
          --execute="SET CLUSTER SETTING bulkio.backup.proxy_file_writes.enabled = default; SET CLUSTER SETTING kv.bulk_io_write.max_rate = default; SET CLUSTER SETTING kv.bulk_io_write.concurrent_addsstable_requests = default;" 2>&1 | tail -n 5
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Verify TPCC load succeeded
      ansible.builtin.shell: |
        COCKROACH_PASSWORD='{{ driver_db_password }}' timeout 30 {{ driver_bin_path }} sql \
          --certs-dir={{ driver_certs_dir }} \
          --host={{ driver_resolved_target }}:{{ driver_sql_port }} \
          --user={{ driver_db_user }} \
          --execute="SELECT count(*) FROM tpcc.warehouse;" 2>&1 | tr -d ' \r' | grep -E '^[0-9]+$' | tail -n1
      args:
        executable: /bin/bash
      register: _tpcc_verify
      changed_when: false
      failed_when: false

    - name: Fail if TPCC warehouses != expected after load
      ansible.builtin.fail:
        msg: "TPCC load failed — expected {{ driver_tpcc_warehouses }} warehouses, got {{ _tpcc_verify.stdout | default('?') }}. See {{ driver_results_dir }}/tpcc-load.log"
      when: _tpcc_verify.stdout | default('0') | trim | int != driver_tpcc_warehouses | int

    - name: Build workload URI and file names (single timestamp for log+hist)
      ansible.builtin.set_fact:
        _bench_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
        _tpcc_uri: "postgres://{{ driver_db_user }}:{{ driver_db_password }}@{{ driver_resolved_target }}:{{ driver_sql_port }}/tpcc?sslmode=require&sslrootcert={{ driver_certs_dir }}/ca.crt"
      # Use cached timestamp so hist and log share same name (avoid 1s drift from double lookup)
    - name: Set log/hist paths from timestamp
      ansible.builtin.set_fact:
        _tpcc_hist: "{{ driver_results_dir }}/tpcc-{{ _bench_ts }}.hist.json"
        _tpcc_log: "{{ driver_results_dir }}/tpcc-{{ _bench_ts }}.log"

    - name: Run TPCC workload (concurrency={{ driver_tpcc_concurrency }}, duration={{ driver_tpcc_duration }}, warehouses={{ driver_tpcc_warehouses }})
      ansible.builtin.shell: |
        set -o pipefail
        echo "[{{ _bench_ts }}] Starting TPCC: warehouses={{ driver_tpcc_warehouses }} concurrency={{ driver_tpcc_concurrency }} duration={{ driver_tpcc_duration }} target={{ driver_resolved_target }} (TLS dbadmin)"
        # stdbuf -oL ensures line-buffered output so log tail is visible even if workload still running; timeout handles duration+slack
        COCKROACH_PASSWORD='{{ driver_db_password }}' timeout {{ (driver_tpcc_duration | regex_replace('m','') | int * 60 + 300) }}s stdbuf -oL -eL {{ driver_bin_path }} workload run tpcc \
          --warehouses={{ driver_tpcc_warehouses }} \
          --concurrency={{ driver_tpcc_concurrency }} \
          --duration={{ driver_tpcc_duration }} \
          {{ '--tolerate-errors' if driver_tpcc_tolerate_errors | bool else '' }} \
          --histograms={{ _tpcc_hist }} \
          {{ driver_tpcc_extra_args }} \
          "{{ _tpcc_uri }}" 2>&1 | stdbuf -oL tee {{ _tpcc_log }}
        rc=${PIPESTATUS[0]}
        echo "WORKLOAD_RC:$rc"
        exit $rc
      args:
        executable: /bin/bash
      register: _tpcc_run
      changed_when: true
      failed_when: false
      # duration 10m + 5m slack for histograms flush

    # CSV output (one row per benchmark run)
    - name: Ensure benchmark CSV header exists
      ansible.builtin.shell: |
        csv="{{ driver_results_dir }}/benchmark.csv"
        if [ ! -f "$csv" ]; then
          echo "timestamp,db_type,host,port,warehouses,concurrency,duration,tpmC,efficiency_pct,avg_ms,p50_ms,p90_ms,p95_ms,p99_ms,pMax_ms,ops_total,errors,log_file,hist_file,rc" > "$csv"
          chown {{ ansible_user | default('evan') }}:{{ ansible_user | default('evan') }} "$csv" 2>/dev/null || true
        fi
        cat "$csv"
      args:
        executable: /bin/bash
      register: _csv_header
      changed_when: false

    - name: Parse TPCC log and append CSV row
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          csv="{{ driver_results_dir }}/benchmark.csv"
          log="{{ _tpcc_log }}"
          hist="{{ _tpcc_hist }}"
          line="$(grep -E '^[[:space:]]+[0-9]+\.[0-9]s[[:space:]]+[0-9]' "$log" 2>/dev/null | tail -n 1 || true)"
          if [ -z "$line" ]; then
            tpmC=""; efc=""; avg=""; p50=""; p90=""; p95=""; p99=""; pMax=""
          else
            tpmC="$(echo "$line" | awk '{print $2}')"
            efc="$(echo "$line" | awk '{print $3}' | tr -d '%')"
            avg="$(echo "$line" | awk '{print $4}')"
            p50="$(echo "$line" | awk '{print $5}')"
            p90="$(echo "$line" | awk '{print $6}')"
            p95="$(echo "$line" | awk '{print $7}')"
            p99="$(echo "$line" | awk '{print $8}')"
            pMax="$(echo "$line" | awk '{print $9}')"
          fi
          ops_total=""; errors=""
          summary_line="$(grep -E '^[[:space:]]+[0-9]+\.[0-9]s[[:space:]]+[0-9]+[[:space:]]+[0-9]+' "$log" 2>/dev/null | tail -n 5 | grep -v "tpmC" | tail -n 1 || true)"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' "$ts" "cockroach" "{{ driver_resolved_target }}" "{{ driver_sql_port }}" "{{ driver_tpcc_warehouses }}" "{{ driver_tpcc_concurrency }}" "{{ driver_tpcc_duration }}" "$tpmC" "$efc" "$avg" "$p50" "$p90" "$p95" "$p99" "$pMax" "$ops_total" "$errors" "$log" "$hist" "{{ _tpcc_run.rc }}" >> "$csv"
        executable: /bin/bash
      register: _csv_row
      changed_when: true

    - name: Fetch CSV to controller
      ansible.builtin.fetch:
        src: "{{ driver_results_dir }}/benchmark.csv"
        dest: "{{ playbook_dir }}/tmp/benchmark.csv"
        flat: true
      failed_when: false

    # Raw interval CSV
    - name: Generate raw data CSV (per-interval ops/latency, 1 row per txn per second)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          raw_csv="{{ driver_results_dir }}/benchmark-raw-{{ _bench_ts }}.csv"
          log="{{ _tpcc_log }}"
          hist="{{ _tpcc_hist }}"
          echo "timestamp,elapsed,errors,ops_inst,ops_cum,avg_ms,p50_ms,p95_ms,p99_ms,pMax_ms,txn_type,warehouses,concurrency,duration,log_file,hist_file" > "$raw_csv"
          grep -E '^[[:space:]]+[0-9]+\.[0-9]s[[:space:]]+[0-9]' "$log" 2>/dev/null | grep -E '(delivery|newOrder|orderStatus|payment|stockLevel)$' | grep -v "%" | while read -ra arr; do
            ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            elapsed="${arr[0]}"; errors="${arr[1]}"; ops_inst="${arr[2]}"; ops_cum="${arr[3]}"
            n="$(printf '%s\n' "${arr[@]}" | wc -l)"
            txn="${arr[$((n-1))]}"
            lat_count=$((n-5))
            if [ "$lat_count" -eq 4 ]; then
              avg=""; p50="${arr[4]}"; p95="${arr[5]}"; p99="${arr[6]}"; pMax="${arr[7]}"
            elif [ "$lat_count" -eq 5 ]; then
              avg="${arr[4]}"; p50="${arr[5]}"; p95="${arr[6]}"; p99="${arr[7]}"; pMax="${arr[8]}"
            else
              avg=""; p50=""; p95=""; p99=""; pMax=""
            fi
            printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' "$ts" "$elapsed" "$errors" "$ops_inst" "$ops_cum" "$avg" "$p50" "$p95" "$p99" "$pMax" "$txn" "{{ driver_tpcc_warehouses }}" "{{ driver_tpcc_concurrency }}" "{{ driver_tpcc_duration }}" "$log" "$hist" >> "$raw_csv"
          done
        executable: /bin/bash
      register: _raw_csv
      changed_when: true

    - name: Fetch raw CSV to controller
      ansible.builtin.fetch:
        src: "{{ driver_results_dir }}/benchmark-raw-{{ _bench_ts }}.csv"
        dest: "{{ playbook_dir }}/tmp/benchmark-raw-{{ _bench_ts }}.csv"
        flat: true
      failed_when: false

    - name: Drop TPCC database after benchmark run
      ansible.builtin.shell: |
        COCKROACH_PASSWORD='{{ driver_db_password }}' timeout 60 {{ driver_bin_path }} sql \
          --certs-dir={{ driver_certs_dir }} \
          --host={{ driver_resolved_target }}:{{ driver_sql_port }} \
          --user={{ driver_db_user }} \
          --execute="DROP DATABASE IF EXISTS tpcc CASCADE;"
      args:
        executable: /bin/bash
      changed_when: true
