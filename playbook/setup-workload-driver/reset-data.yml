---
# =============================================================================
# reset-data.yml — Reset TPC-C database and re-import fixtures from workload driver
#
# Target group : driver (vm-crdb-driver-sea-01)
# Run         : ansible-playbook -i inventory.yml reset-data.yml
#
# What it does:
#   1) Resolves cluster target host and connection variables using driver vars
#   2) Drops existing tpcc database (DROP DATABASE IF EXISTS tpcc CASCADE)
#   3) Re-imports TPC-C fixture at configured warehouse scale
# =============================================================================

- name: Reset TPC-C data on cluster from workload driver
  hosts: driver
  become: true
  vars_files:
    - vars/driver.yml

  pre_tasks:
    - name: Resolve target host and connection variables
      ansible.builtin.set_fact:
        crdb_host: >-
          {{ crdb_host if (crdb_host is defined and crdb_host | length > 0)
             else (driver_target_host if (driver_target_host is defined and driver_target_host | length > 0)
             else hostvars[groups['crdb_main'][0]]['ansible_host'] | default(hostvars[groups['crdb_main'][0]]['public_ip'])) }}
        crdb_sql_port: "{{ driver_sql_port | default(26257) }}"
        tpcc_warehouses: "{{ driver_tpcc_warehouses | default(10) }}"
        crdb_auth_flag: "--certs-dir={{ driver_certs_dir }}"

  tasks:
    - name: Drop tpcc database if it exists
      ansible.builtin.shell: >
        cockroach sql {{ crdb_auth_flag }} --host={{ crdb_host }}:{{ crdb_sql_port }}
        -e "DROP DATABASE IF EXISTS tpcc CASCADE;"
      changed_when: true

    - name: Re-import TPC-C fixture at configured scale
      ansible.builtin.shell: >
        cockroach workload fixtures import tpcc
        --warehouses={{ tpcc_warehouses }} {{ crdb_auth_flag }}
        "postgresql://root@{{ crdb_host }}:{{ crdb_sql_port }}?sslmode=disable"
      changed_when: true
